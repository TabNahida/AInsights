name: Update Artificial Analysis model data

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-data-writer-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  update-model-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start from the latest branch state
        shell: bash
        run: |
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          echo "UPDATE_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ranking analysis dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch latest Artificial Analysis data
        run: python ArtificialAnalysis/scrape_artificial_analysis.py --output-dir ArtificialAnalysis --allow-stale

      - name: Rebuild site from reviewed benchmark data
        run: python scripts/build_docs_site.py

      - name: Validate AIndex mixed Core scheme 07 production output
        run: python -B analysis/irt_leaderboard_exploration/validate_mixed_core_production.py --input docs/data/models.json

      - name: Run regression tests
        run: python -B -m unittest discover -s tests

      - name: Commit changed model data and site
        id: commit
        shell: bash
        run: |
          git add -- ArtificialAnalysis/artificialanalysis_raw_scores_wide.csv
          git add -- docs/data/models.json docs/data/models.js docs/assets/logos
          git add -- docs/index.html docs/full-rank.html docs/sources.html docs/contribute.html
          git add -- docs/providers.html docs/compare.html docs/provider.html docs/benchmark.html docs/model.html
          git add -- analysis/irt_leaderboard_exploration/outputs/full_rankings_aindex_scheme18.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_aindex_scheme18.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/full_rankings_exact_config_aindex_scheme18.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_exact_config_aindex_scheme18.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/aindex_scheme18_validation_summary.json
          git add -- analysis/irt_leaderboard_exploration/outputs/full_rankings_aindex_mixed_core.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_aindex_mixed_core.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/full_rankings_exact_config_aindex_mixed_core.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_exact_config_aindex_mixed_core.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/aindex_mixed_core_validation_summary.json
          git add -- analysis/irt_leaderboard_exploration/outputs/exact_config_multi_method_full_rankings.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/exact_config_score_visibility_audit.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/full_rankings_exact_config_twopl_sparse_80_20_score.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/full_rankings_twopl_sparse_80_20_score.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/key_pair_overlap_audit.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/method_stability.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/multi_method_full_rankings.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/multi_method_top50.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/multi_method_validation_summary.json
          git add -- analysis/irt_leaderboard_exploration/outputs/score_order_validation_summary.json
          git add -- analysis/irt_leaderboard_exploration/outputs/target_exact_config_comparison.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/target_source_coverage_audit.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_exact_config_twopl_sparse_80_20_score.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_global_family_percentile.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_percentile_mean_equal_board.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_percentile_median_equal_board.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_rasch_dense_item_sensitivity.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_rasch_equal_board.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_rasch_sparse_item_sensitivity.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_twopl_equal_board.csv
          git add -- analysis/irt_leaderboard_exploration/outputs/top50_twopl_sparse_80_20_score.csv

          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::The model update produced changes outside the reviewed generated paths."
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No Artificial Analysis model changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Artificial Analysis model data"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the branch has not advanced
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$remote_sha" != "$UPDATE_BASE_SHA" ]; then
            echo "::error::The branch advanced during generation. Rerun so generated files use the latest code and data."
            exit 1
          fi

      - name: Push changed model data and site
        if: steps.commit.outputs.changed == 'true'
        run: git push origin "HEAD:$GITHUB_REF_NAME"
